<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinDrop Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 40px; }
        h1 { text-align: center; margin-bottom: 30px; }
        .stats { display: flex; gap: 2rem; justify-content: center; margin-bottom: 40px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 150px; text-align: center; box-shadow: 0 0 10px #000; }
        canvas { background: #1e1e1e; border-radius: 12px; padding: 10px; margin-bottom: 40px; }
    </style>
</head>
<body>
    <h1>📊 CoinDrop Analytics Dashboard</h1>

    <div class="stats">
        <div class="card">
            <h2>{{ total_users }}</h2>
            <p>Total Users</p>
        </div>
        <div class="card">
            <h2>{{ total_txns }}</h2>
            <p>Total Transactions</p>
        </div>
    </div>

    <div class="card" style="margin: auto; width: 70%;">
        <h3>Total Token Volume</h3>
        <canvas id="volumeChart" height="150"></canvas>
    </div>

    <script>
        // Prepare data from Flask template
        const volumes = {{ volumes | safe }};
        const tokenLabels = volumes.map(v => v.symbol);
        const scaledVolumes = volumes.map(v => v.scaled_volume);

        const ctx = document.getElementById('volumeChart');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: tokenLabels,
                datasets: [{
                    label: 'Volume (Scaled for Chart)',
                    data: scaledVolumes,
                    backgroundColor: 'rgba(0, 255, 159, 0.7)',
                    borderColor: 'rgba(0, 255, 159, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const index = context.dataIndex;
                                const realAmount = volumes[index].volume.toFixed(6);
                                const symbol = volumes[index].symbol;
                                return `${realAmount} ${symbol}`;
                            }
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { color: '#fff' } },
                    x: { ticks: { color: '#fff' } }
                }
            }
        });
    </script>
</body>
</html>
